services:
  - type: web
    name: prevat-tech
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prevat-tech-db
          property: connectionString

databases:
  - name: prevat-tech-db
    plan: free
