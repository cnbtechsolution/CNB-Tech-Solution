services:
  - type: web
    name: cnb-tech-solution
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador Master
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CNB_EMAIL_REMETENTE
        value: cnbtvpara2019@gmail.com
      - key: CNB_GMAIL_APP_PASSWORD
        sync: false
